<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuCluster — Clustering Results & Dendrogram</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-glass sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-diagram-3-fill text-primary fs-3"></i>
        <span class="brand-badge">DocuCluster</span>
      </a>
      <div class="d-flex gap-2">
        <a href="/" class="btn btn-secondary-glass btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Back to Upload
        </a>
        <a id="btn-export-results" href="/export" class="btn btn-primary-gradient btn-sm" download="cluster_assignments.csv">
          <i class="bi bi-download me-1"></i> Download CSV
        </a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="card card-glass mb-4">
      <div class="card-body p-4">
        <h4 class="card-title mb-3">Dendrogram Tree View</h4>
        <div id="dendrogram-container" style="min-height: 520px;"></div>
      </div>
    </div>

    <div class="card card-glass">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">Cluster Assignments</h5>
        <div class="table-responsive">
          <table class="table table-glass align-middle mb-0">
            <thead>
              <tr>
                <th>Doc ID</th>
                <th>Document Name</th>
                <th class="text-end">Assigned Cluster</th>
              </tr>
            </thead>
            <tbody id="assignments-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/dendrogram.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/dendrogram')
        .then(res => res.json())
        .then(data => {
          if (data.dendrogram) {
            renderDendrogram(data.dendrogram);
          }
        })
        .catch(err => console.error('Failed to load dendrogram:', err));
    });
  </script>
</body>
</html>
